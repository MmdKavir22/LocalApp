name: Build & Release APK

on:
  push:
    branches: [main]
    paths: ["android/**", "server/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

env:
  PACKAGE: com.kavir.remote
  # Optional: lets Kavir Store pick up a release within a minute instead of within the hour.
  KAVIR_STORE_TOKEN: ${{ secrets.KAVIR_STORE_TOKEN }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Decide version (versionCode always increases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST_TAG=$(gh release list --limit 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          LAST=0
          if [[ "$LAST_TAG" =~ ^v1\.0\.([0-9]+)$ ]]; then LAST=${BASH_REMATCH[1]}; fi
          RUN=${{ github.run_number }}
          CODE=$(( RUN > LAST ? RUN : LAST + 1 ))
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.$CODE" >> "$GITHUB_ENV"
          echo "Previous release: ${LAST_TAG:-none}  ->  building versionCode $CODE (1.0.$CODE)"

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing. All releases must be signed with the same key (see README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kr.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/kr.keystore" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace -PappVersionCode=${{ env.VERSION_CODE }} -PappVersionName=${{ env.VERSION_NAME }}

      - name: Verify APK (package, version, signature, upgrade compatibility)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          fail() { echo "::error::$1"; exit 1; }
          badging() { "$BT/aapt2" dump badging "$1"; }
          pkgname() { sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1; }
          vcode() { sed -n "s/^package: .*[ ]versionCode='\([0-9]*\)'.*/\1/p" | head -1; }
          signer() { "$BT/apksigner" verify --print-certs "$1" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1; }

          info=$(badging "$APK")
          pkg=$(pkgname <<<"$info"); code=$(vcode <<<"$info")
          minsdk=$(sed -n "s/^\(minSdkVersion\|sdkVersion\):'\([0-9]*\)'.*/\2/p" <<<"$info" | head -1)
          sig=$(signer "$APK")
          echo "package=$pkg versionCode=$code minSdk=$minsdk"
          echo "signer SHA-256=$sig"
          [ "$pkg" = "$PACKAGE" ] || fail "Package name changed ($pkg != $PACKAGE) - installed apps could not be updated"
          [ "$code" = "$VERSION_CODE" ] || fail "versionCode in APK ($code) differs from expected ($VERSION_CODE)"
          [ -n "$sig" ] || fail "APK is unsigned or its signature is invalid"

          mkdir -p prev
          if gh release download --pattern '*.apk' --dir prev 2>/dev/null && ls prev/*.apk >/dev/null 2>&1; then
            PREV=$(ls prev/*.apk | head -1)
            pinfo=$(badging "$PREV")
            ppkg=$(pkgname <<<"$pinfo"); pcode=$(vcode <<<"$pinfo"); psig=$(signer "$PREV")
            echo "previous release: package=$ppkg versionCode=$pcode signer=$psig"
            [ "$ppkg" = "$pkg" ] || fail "Package name differs from the previous release"
            [ "$psig" = "$sig" ] || fail "Signing certificate differs from the previous release - installed apps could not be updated"
            [ "$code" -gt "$pcode" ] || fail "versionCode ($code) must be greater than the previous release ($pcode)"
            echo "OK: same package + same signing key, versionCode $pcode -> $code"
          else
            echo "No previous release APK to compare with."
          fi

      - name: Collect release files
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/KavirRemote-v${VERSION_NAME}.apk"
          (cd server && zip -qr "../dist/KavirRemoteServer-v${VERSION_NAME}.zip" . -x '*/__pycache__/*' '*.pyc' '.venv/*' 'data/*')
          ls -la dist

      - name: Upload build report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/app/build/reports/**
            android/app/build/outputs/logs/**
          if-no-files-found: ignore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Kavir Remote v${{ env.VERSION_NAME }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
          body: |
            **Kavir Remote** `${{ env.PACKAGE }}` — version ${{ env.VERSION_NAME }} (versionCode ${{ env.VERSION_CODE }}). Updates are delivered through Kavir Store.
          files: |
            dist/KavirRemote-v${{ env.VERSION_NAME }}.apk
            dist/KavirRemoteServer-v${{ env.VERSION_NAME }}.zip

      - name: Ask Kavir Store to sync now (optional)
        if: ${{ env.KAVIR_STORE_TOKEN != '' }}
        continue-on-error: true
        run: |
          curl -sS -f -X POST \
            -H "Authorization: Bearer $KAVIR_STORE_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/kavirkobra19/KavirStore/dispatches \
            -d '{"event_type":"app-release","client_payload":{"repo":"${{ github.repository }}"}}'
