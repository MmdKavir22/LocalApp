name: Build & Release APK

on:
  push:
    branches: [main]
    paths: ["android/**", "server/**", ".github/workflows/build.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is missing. All releases must be signed with the same key (see README)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kr.keystore"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/kr.keystore" >> "$GITHUB_ENV"
          echo "VERSION_NAME=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace -PappVersionCode=${{ github.run_number }} -PappVersionName=${{ env.VERSION_NAME }}

      - name: Collect release files
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/KavirRemote-v${VERSION_NAME}.apk"
          (cd server && zip -qr "../dist/KavirRemoteServer-v${VERSION_NAME}.zip" . -x '*/__pycache__/*' '*.pyc' '.venv/*' 'data/*')
          ls -la dist

      - name: Upload build report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            android/app/build/reports/**
            android/app/build/outputs/logs/**
          if-no-files-found: ignore

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION_NAME }}
          name: Kavir Remote v${{ env.VERSION_NAME }}
          generate_release_notes: true
          files: |
            dist/KavirRemote-v${{ env.VERSION_NAME }}.apk
            dist/KavirRemoteServer-v${{ env.VERSION_NAME }}.zip
